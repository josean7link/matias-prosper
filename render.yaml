# render.yaml — Render Infrastructure-as-Code
# Declara los servicios backend (FastAPI) + andes-gateway (Node). El frontend
# va en Vercel (ver frontend/vercel.json).
#
# Los valores reales para cada `sync: false` de abajo están en la carpeta
# hermana `env-vars/` (fuera de este repo, nunca se commitea) — ver
# `env-vars/README.md` para el detalle de dónde pegar cada uno.
#
# Docs: https://render.com/docs/infrastructure-as-code

services:
  # ────────────────────────────────────────────────────────────────────────
  # Backend principal (FastAPI)
  # ────────────────────────────────────────────────────────────────────────
  - type: web
    name: prosper-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Render asigna el puerto via $PORT; uvicorn ya usa --port 8001 pero
    # Render mapea internamente su puerto expuesto — no necesita cambio.
    plan: starter
    healthCheckPath: /api/health
    envVars:
      # ── Core / DB ──────────────────────────────────────────────────────
      - key: MONGO_URL
        sync: false          # Mismo Atlas que ya usa codigo_limpio — NO usar localhost
      - key: DB_NAME
        value: prosper_prod
      - key: REDIS_URL
        sync: false          # Mismo Upstash que ya usa codigo_limpio
      - key: JWT_SECRET
        generateValue: true
      - key: MFA_FERNET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: onboarding@resend.dev
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        sync: false          # Se setea después de conocer la URL de Vercel
      - key: PUBLIC_BASE_URL
        sync: false          # URL pública de ESTE servicio en Render, se sabe recién después del primer deploy
      - key: PROSPER_ENV
        value: production    # Solo tag de observability (Sentry), no confundir con PROSPER_MODE
      - key: PROSPER_DISABLE_RATELIMIT
        value: "1"

      # ── AiPrise (KYB/KYC de orgs business — individuos usan Andes) ─────
      - key: AIPRISE_ENVIRONMENT
        value: sandbox
      - key: AIPRISE_API_KEY_SANDBOX
        sync: false
      - key: AIPRISE_API_KEY_PRODUCTION
        sync: false
      - key: AIPRISE_KYC_TEMPLATE_ID
        value: ""
      - key: AIPRISE_KYB_TEMPLATE_ID
        value: ""
      - key: AIPRISE_WEBHOOK_SECRET
        sync: false
      - key: AIPRISE_DEPRECATED
        value: "1"

      # ── Alfred (rampa/KYC — hoy en sandbox, fallback de Andes) ─────────
      - key: ALFRED_MODE
        value: sandbox
      - key: ALFRED_API_KEY
        sync: false
      - key: ALFRED_API_SECRET
        sync: false
      - key: ALFRED_WEBHOOK_SECRET
        sync: false
      - key: ALFRED_BUSINESS_ID
        value: "187"
      - key: ALFRED_API_BASE_SANDBOX
        value: https://penny-api-restricted-dev.alfredpay.io/api/v1/third-party-service/penny
      - key: ALFRED_API_BASE_PRODUCTION
        value: https://penny-api-restricted.alfredpay.io/api/v1/third-party-service/penny
      - key: ALFRED_CALLBACK_URL
        sync: false          # completar con la URL pública de este servicio + path del webhook
      - key: ALFRED_KYC_MODE
        value: sandbox
      - key: ALFRED_KYC_BASE_SANDBOX
        value: https://api-dev-services.alfredpay.app/api/v1
      - key: ALFRED_KYC_BASE_PRODUCTION
        value: https://api-services.alfredpay.app/api/v1

      # ── Prosper CMS (minter Stellar) ────────────────────────────────────
      - key: PROSPER_MODE
        value: development   # "development"/"production" = llamadas reales a PROSPER_API_BASE; "mock" = simulado
      - key: PROSPER_API_BASE
        value: https://cmsback.protocol-prosper.io
      - key: PROSPER_API_USER
        sync: false
      - key: PROSPER_API_PASS
        sync: false
      - key: PROSPER_ASSET_CODE
        value: USDCP
      - key: PROSPER_ISSUER_PUBLIC_KEY
        value: GDGHSEYRDQ3KCWEKSSWTIB4CHPXAXDQGEEO3LNVKNUVTUMRCNAWAE3N5
      - key: PROSPER_DISTRIBUTION_PUBLIC_KEY
        value: CD2NVPKBQK3J42JABNAN3WRQITQMBH4TH2MNIEVAIMJEQ2HRJBVMVVWY
      - key: PROSPER_DEPOSIT_ADDRESS
        value: GCCHGZRZ4QTI4WRWRKHXAUD7SKCSUHRXOXG66EZLAW4FSMRPDHRLNE77
      - key: PROSPER_DEPOSIT_MODE
        value: mock
      - key: PROSPER_TREASURY_ADDRESS
        value: GAG42MXCJCL4PQTDUFGXD26OAABXVW7NNWJCHU3B66ADMNQ2EJFHAFK2

      # ── ARSa / USDC (direcciones públicas Stellar, no son secretas) ────
      - key: ARSA_ISSUER
        value: GCVIA2UOUEM6JATLDQVXERXPSELWBRCDHB53SOAYBGUOHNOSUII4T5NE
      - key: ARSA_CODE
        value: ARSa
      - key: ARSA_SAC
        value: CDYP52X4FIXSPDK76JGJT6J3NH2EV2GMBJ2KCEKMYMR36OSB3Y4CHFPL
      - key: USDC_STELLAR_ISSUER
        value: GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN
      - key: INVEST_MIN_USDC
        value: "10"
      - key: CONVERSION_QUOTE_TTL_SECONDS
        value: "60"
      - key: ARSA_NATIVE_YIELD_ENABLED
        value: "false"

      # ── Phase 13 — Ramp provider abstraction (Andes) ────────────────────
      - key: RAMP_PROVIDER
        value: andeslabs
      - key: RAMP_PROVIDER_MODE
        value: sandbox
      - key: ANDES_GATEWAY_URL
        sync: false          # URL pública del servicio prosper-andes-gateway (ver abajo), una vez desplegado
      - key: GATEWAY_INTERNAL_TOKEN
        sync: false          # Debe ser IDÉNTICO al que se setea en prosper-andes-gateway

      # ── Phase 02 — Deposit Detection Engine: apagado en este deploy ────
      # (ver ANALISIS_PROSPER_PROJECT.md / DEPLOY_ADAPTATION.md — falta
      # wiring del scheduler en server.py, no lo prendemos a ciegas)
      - key: DEPOSIT_ENGINE_ENABLED
        value: "false"
      - key: HORIZON_MODE
        value: mock
      - key: STELLAR_HORIZON_URL
        value: https://horizon.stellar.org
      - key: HORIZON_POLL_INTERVAL_SECONDS
        value: "12"
      - key: DEPOSIT_ORPHAN_TIMEOUT_MINUTES
        value: "90"
      - key: ARSA_BACKUP_POLLER_INTERVAL_SECONDS
        value: "300"
      - key: DEPOSIT_REDIS_PUBSUB_CHANNEL
        value: prosper.deposits

  # ────────────────────────────────────────────────────────────────────────
  # andes-gateway (Node/Fastify — wrapper de @andeslabs/mint-sdk)
  # Arranca en modo "real" por default; si falta ANDES_API_KEY, degrada solo
  # a mock (no crashea). Podés desplegarlo ahora y sumar las credenciales
  # reales de Andes después sin volver a tocar código.
  # ────────────────────────────────────────────────────────────────────────
  - type: web
    name: prosper-andes-gateway
    runtime: docker
    dockerfilePath: ./services/andes-gateway/Dockerfile
    dockerContext: ./services/andes-gateway
    plan: free   # subir a starter si el cold start afecta el flujo de KYC/onramp
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8090"
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: GATEWAY_INTERNAL_TOKEN
        sync: false          # Debe ser IDÉNTICO al que se setea en prosper-api
      - key: PROSPER_BACKEND_URL
        sync: false          # URL pública de prosper-api (para reenviar webhooks verificados)
      - key: ANDES_GATEWAY_MODE
        value: real          # con ANDES_API_KEY vacío, degrada solo a mock — ver nota arriba
      - key: ANDES_API_KEY
        sync: false          # ROTAR antes de usar — la vieja está en memory/PROD_DEPLOY.md, marcada para rotación
      - key: ANDES_JWT_PRIVATE_KEY_PATH
        sync: false          # path al secret file (Render → Environment → Secret Files) — subir la PEM rotada, no la vieja
      - key: ANDES_BASE_URL
        sync: false
      - key: ANDES_ISSUER
        sync: false
